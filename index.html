<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click-Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>Click Game</h1>
    <button id="newGame">New Game</button>
    <button id="loadGame">Load Game</button>
  </div>
  <div id="loadmenu" class="hidden">
    <h1>Load Game</h1>
    <button id="loadSlot1">Load Slot 1</button>
    <button id="loadSlot2">Load Slot 2</button>
    <button id="loadSlot3">Load Slot 3</button>
    <button id="backToMenu">Back</button>
  </div>
  <div id="game" class="hidden">
    <table border="1">
      <tr>
        <td>
          <table border="1">
            <tr>
              <td>
                <img id="sceneImg" src="images/room1_north.jpg" alt="Concrete Cell, facing north">
              </td>
            </tr>
            <tr>
              <td>
                <table border="1">
                  <tr>
                    <td colspan="1" style="width:200px;">FACING: <span id="facingDirection">North</span></td>
                    <td colspan="2" style="height:100px; width:600px;">
                      <div id="message">Welcome to the game!</div>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <table border="1">
                        <tr>
                          <td></td>
                          <td><button id="turnNorth" aria-label="Turn North">North</button></td>
                          <td></td>
                        </tr>
                        <tr>
                          <td><button id="turnWest" aria-label="Turn West">West</button></td>
                          <td>Turn</td>
                          <td><button id="turnEast" aria-label="Turn East">East</button></td>
                        </tr>
                        <tr>
                          <td></td>
                          <td><button id="turnSouth" aria-label="Turn South">South</button></td>
                          <td></td>
                        </tr>
                      </table>
                    </td>
                    <td>
                      <table border="1">
                        <tr>
                          <td></td>
                          <td><button id="moveNorth" aria-label="Move North">North</button></td>
                          <td></td>
                        </tr>
                        <tr>
                          <td><button id="moveWest" aria-label="Move West">West</button></td>
                          <td>Move</td>
                          <td><button id="moveEast" aria-label="Move East">East</button></td>
                        </tr>
                        <tr>
                          <td></td>
                          <td><button id="moveSouth" aria-label="Move South">South</button></td>
                          <td></td>
                        </tr>
                      </table>
                    </td>
                    <td>
                      <table border="1">
                        <tr>
                          <td><button>Attack</button></td>
                          <td><button>Block</button></td>
                        </tr>
                        <tr>
                          <td><button>Magic</button></td>
                          <td><button>Item</button></td>
                        </tr>
                        <tr>
                          <td colspan="2"><button>Run</button></td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
        <td>
          <table style="width:300px;">
            <tr>
              <td style="width:100;"><button id="saveSlot1" aria-label="Save to Slot 1">Save 1</button></td>
              <td style="width:100;"><button id="saveSlot2" aria-label="Save to Slot 2">Save 2</button></td>
              <td style="width:100;"><button id="saveSlot3" aria-label="Save to Slot 3">Save 3</button></td>
            </tr>
            <tr>
              <td colspan="3"><button id="hintButton" aria-label="Show Hint">Hint</button></td>
            </tr>
            <tr>
              <td colspan="3" style="height:150px;">
                <div id="inspectActions" role="region" aria-label="Inspection Actions"></div>
                <div id="actions" role="region" aria-label="Game Actions"></div>
              </td>
            </tr>
            <tr>
              <td colspan="2">Notes</td>
              <td>Inventory</td>
            </tr>
            <tr>
              <td colspan="2" style="height:308px;" id="notes" role="region" aria-label="Notes">No notes.</td>
              <td style="height:308px;" id="inventory" role="region" aria-label="Inventory">No items.</td>
            </tr>
            <tr>
              <td colspan="3" style="height:206px;" id="searchStatus" role="region" aria-label="Search Status">Search Status</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
<script src="game.js"></script>
</body>
</html>
